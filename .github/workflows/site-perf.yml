name: Site performance

# Обязательный регламент AGENTS.md §2/§4: check и проверка ссылок должны
# проходить (exit 0). Вендорные копии — .github/rules/ (синхронизация:
# python tools/sync_site_perf.py --apply в рабочей папке).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored tools match their hashes
        shell: python
        run: |
          import hashlib, pathlib, sys
          ok = True
          for name in ("site_perf.py", "find_broken_links.py", "check_admin_contract.py"):
              tool = pathlib.Path(".github/rules") / name
              stamp = pathlib.Path(".github/rules") / (name + ".sha256")
              actual = hashlib.sha256(tool.read_bytes()).hexdigest()
              expected = stamp.read_text(encoding="utf-8").split()[0]
              print(f"{name}: {actual[:12]} expected {expected[:12]}")
              ok = ok and actual == expected
          if not ok:
              print("DRIFT: выполните tools/sync_site_perf.py --apply в рабочей папке")
              sys.exit(1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: site_perf check (изображения, атрибуты, фолбэки)
        run: python .github/rules/site_perf.py check .
      - name: broken links (внутренние ссылки и ассеты)
        run: python .github/rules/find_broken_links.py --strict .